name: Update Citation Count

on:
  schedule:
    # Daily. Using a non-zero minute reduces delays on GitHub's busy hour boundary.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-citation-count
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch Google Scholar citation count
        run: python scripts/update_citations.py

      - name: Commit updated citation count
        shell: bash
        run: |
          if git diff --quiet -- assets/js/citation-count.json; then
            echo "Citation count is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/citation-count.json
          git commit -m "chore: update Google Scholar citation count"
          git push
