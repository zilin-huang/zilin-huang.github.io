---
layout: default
---
<!-- page.html -->
        <div class="post">

          {% comment %}
          Global page introduction intentionally hidden.
          Page titles and descriptions remain in front matter for navigation and metadata.
          <header class="post-header page-header">
            <h1 class="post-title">{{ page.title }}</h1>
            {% if page.description %}
            <p class="post-description">{{ page.description }}</p>
            {% endif %}
          </header>
          {% endcomment %}

          <article>
            {{ content }}
          </article>

        </div>
